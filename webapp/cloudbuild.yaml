steps:
  - name: gcr.io/cloud-builders/docker
    env:
      - DOCKER_BUILDKIT=1
    args:
      - build
      - --file
      - webapp/Dockerfile
      - --tag
      - ${_IMAGE}
      - .

images:
  - ${_IMAGE}

options:
  dynamicSubstitutions: true
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY

timeout: 2400s

substitutions:
  _IMAGE: asia-northeast1-docker.pkg.dev/${PROJECT_ID}/ofc-webapp/ofc-pineapple-webapp:${BUILD_ID}
