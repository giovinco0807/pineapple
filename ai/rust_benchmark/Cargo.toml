[package]
name = "ofc_benchmark"
version = "0.1.0"
edition = "2021"

[dependencies]
ofc_core = { path = "../rust_solver/ofc_core" }
ort = { version = "2.0.0-rc.12", features = ["ndarray"] }
anyhow = "1"
ndarray = "0.17"
rayon = "1.8"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
itertools = "0.12"
