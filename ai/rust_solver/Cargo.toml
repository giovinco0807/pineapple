[workspace]
members = ["ofc_core", "fl_solver", "backward", "prob_engine", "cfr_solver", "t4_generator", "t4_exact_solver", "t4_first_exact", "t3_generator", "t3_exact_solver"]
resolver = "2"

[workspace.dependencies]
rayon = "1.8"
itertools = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
clap = { version = "4.4", features = ["derive"] }
