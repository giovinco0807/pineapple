[workspace]
members = ["ofc_core", "fl_solver", "backward", "prob_engine", "cfr_solver", "t1_gen", "benchmark_nesting", "t0_gen", "mcts_gen", "t3_exact"]
resolver = "2"

[workspace.dependencies]
rayon = "1.8"
itertools = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
clap = { version = "4.4", features = ["derive"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
