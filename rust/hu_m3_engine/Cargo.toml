[package]
name = "ofc_hu_m3_engine"
version = "0.1.0"
edition = "2021"

[lib]
name = "ofc_hu_m3_engine"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "ofc_hu_m3_runner"
path = "src/bin/runner.rs"

[dependencies]
blake2b_simd = "1.0"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3.10"
